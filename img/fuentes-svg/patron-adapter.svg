<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" role="img"><title>Patrón Adapter</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#475569" stroke-width="1.4"/></marker><marker id="t" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L11,6 L0,12 z" fill="#fff" stroke="#475569" stroke-width="1.2"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><defs><marker id="d" viewBox="0 0 16 10" refX="1" refY="5" markerWidth="14" markerHeight="9" orient="auto"><path d="M1,5 L8,1 L15,5 L8,9 z" fill="#475569"/></marker></defs><text x="20" y="26" font-size="15" font-weight="700" fill="#1E293B" text-anchor="start">Adapter · integración con la pasarela de pagos</text><text x="20" y="45" font-size="11" font-weight="400" fill="#64748B" text-anchor="start">Cliente → Target (interfaz propia) ◁ Adapter → Adaptee (SDK del proveedor)</text><rect x="20" y="110" width="180" height="75" fill="#E8F3EC" stroke="#2F7D4F" stroke-width="1.3"/><line x1="20" y1="150" x2="200" y2="150" stroke="#2F7D4F" stroke-width="1"/><line x1="20" y1="160" x2="200" y2="160" stroke="#2F7D4F" stroke-width="1"/><text x="110.0" y="125" font-size="9.5" font-weight="400" fill="#64748B" text-anchor="middle">«cliente»</text><text x="110.0" y="140" font-size="12" font-weight="700" fill="#1E293B" text-anchor="middle">CrearPedidoUseCase</text><text x="28" y="175" font-size="10.5" font-weight="400" fill="#1E293B" text-anchor="start">+ ejecutar(cmd)</text><rect x="260" y="110" width="220" height="90" fill="#FDF3E3" stroke="#B7791F" stroke-width="1.3"/><line x1="260" y1="150" x2="480" y2="150" stroke="#B7791F" stroke-width="1"/><line x1="260" y1="160" x2="480" y2="160" stroke="#B7791F" stroke-width="1"/><text x="370.0" y="125" font-size="9.5" font-weight="400" fill="#64748B" text-anchor="middle">«interface · target»</text><text x="370.0" y="140" font-size="12" font-weight="700" fill="#1E293B" text-anchor="middle" font-style="italic">PaymentPort</text><text x="268" y="175" font-size="10.5" font-weight="400" fill="#1E293B" text-anchor="start">+ cobrar(monto, token)</text><text x="268" y="190" font-size="10.5" font-weight="400" fill="#1E293B" text-anchor="start">      : Promise&lt;ResultadoCobro&gt;</text><rect x="260" y="230" width="220" height="75" fill="#F1ECF9" stroke="#6D4AA8" stroke-width="1.3"/><line x1="260" y1="270" x2="480" y2="270" stroke="#6D4AA8" stroke-width="1"/><line x1="260" y1="280" x2="480" y2="280" stroke="#6D4AA8" stroke-width="1"/><text x="370.0" y="245" font-size="9.5" font-weight="400" fill="#64748B" text-anchor="middle">«adapter»</text><text x="370.0" y="260" font-size="12" font-weight="700" fill="#1E293B" text-anchor="middle">StripePaymentAdapter</text><text x="268" y="295" font-size="10.5" font-weight="400" fill="#1E293B" text-anchor="start">+ cobrar(monto, token)</text><rect x="560" y="230" width="200" height="75" fill="#F1F5F9" stroke="#64748B" stroke-width="1.3"/><line x1="560" y1="270" x2="760" y2="270" stroke="#64748B" stroke-width="1"/><line x1="560" y1="280" x2="760" y2="280" stroke="#64748B" stroke-width="1"/><text x="660.0" y="245" font-size="9.5" font-weight="400" fill="#64748B" text-anchor="middle">«adaptee · externo»</text><text x="660.0" y="260" font-size="12" font-weight="700" fill="#1E293B" text-anchor="middle">Stripe SDK</text><text x="568" y="295" font-size="10.5" font-weight="400" fill="#1E293B" text-anchor="start">API propia del proveedor</text><path d="M200,150 L259,150" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#o)"/><text x="230" y="144" font-size="9.5" fill="#64748B" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="3">usa</text><path d="M370.0,230 L370.0,201" fill="none" stroke="#475569" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#t)"/><path d="M480,267.5 L559,267.5" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#o)"/><text x="520" y="261.5" font-size="9.5" fill="#64748B" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="3">traduce llamadas</text><path d="M560,105 h268 l12,12 v58 h-280 z" fill="#FFFBEA" stroke="#B7A54A" stroke-width="1.1"/><path d="M828,105 v12 h12" fill="none" stroke="#B7A54A" stroke-width="1.1"/><text x="568" y="121" font-size="10" font-weight="400" fill="#1E293B" text-anchor="start">Mismo esquema para PayPalPaymentAdapter</text><text x="568" y="135" font-size="10" font-weight="400" fill="#1E293B" text-anchor="start">y para la integración con el ERP</text><text x="568" y="149" font-size="10" font-weight="400" fill="#1E293B" text-anchor="start">(ErpPort ◁ ErpAdapter → API del ERP).</text></svg>