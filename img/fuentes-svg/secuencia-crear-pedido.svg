ido [PENDIENTE]</text><path d="M381,252 L519,252" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#a)"/><text x="450.0" y="247" font-size="10" fill="#1E293B" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="3">4. total()</text><path d="M519,270 L381,270" fill="none" stroke="#475569" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#o)"/><text x="450.0" y="265" font-size="10" fill="#1E293B" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="3">monto</text><path d="M381,290 L667,290" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#a)"/><text x="524.0" y="285" font-size="10" fill="#1E293B" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="3">5. cobrar(monto, tokenPago)</text><path d="M677,310 L963,310" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#a)"/><text x="820.0" y="305" font-size="10" fill="#1E293B" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="3">6. solicitud de cobro [HTTPS]</text><path d="M963,330 L677,330" fill="none" stroke="#475569" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#o)"/><text x="820.0" y="325" font-size="10" fill="#1E293B" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="3">respuesta del proveedor</text><path d="M667,350 L381,350" fill="none" stroke="#475569" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#o)"/><text x="524.0" y="345" font-size="10" fill="#1E293B" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="3">ResultadoCobro</text><rect x="30" y="372" width="1136" height="345" fill="none" stroke="#475569" stroke-width="1.2"/><path d="M30,372 h46 v12 l-8,8 h-38 z" fill="#F1F5F9" stroke="#475569" stroke-width="1.2"/><text x="44" y="387" font-size="11" font-weight="700" fill="#1E293B" text-anchor="start">alt</text><text x="90" y="392" font-size="10.5" font-weight="600" fill="#1E293B" text-anchor="start">[cobro.aprobado]</text><rect x="