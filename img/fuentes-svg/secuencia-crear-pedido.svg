ke-dasharray="6 4"/><text x="90" y="624" font-size="10.5" font-weight="600" fill="#1E293B" text-anchor="start">[else: pago rechazado]</text><path d="M371,650 L233,650" fill="none" stroke="#475569" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#o)"/><text x="302.0" y="645" font-size="10" fill="#1E293B" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="3">11. lanza PagoRechazadoError</text><path d="M223,680 L85,680" fill="none" stroke="#475569" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#o)"/><text x="154.0" y="675" font-size="10" fill="#1E293B" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="3">12. 402 Payment Required {motivo}</text><path d="M554,640 h318 l12,12 v40 h-330 z" fill="#FFFBEA" stroke="#B7A54A" stroke-width="1.1"/><path d="M872,640 v12 h12" fill="none" stroke="#B7A54A" stroke-width="1.1"/><text x="562" y="656" font-size="10" font-weight="400" fill="#1E293B" text-anchor="start">El pedido no se guarda si el pago es rechazado.</text><text x="562" y="670" font-size="10" font-weight="400" fill="#1E293B" text-anchor="start">El controlador traduce la excepción</text><text x="562" y="684" font-size="10" font-weight="400" fill="#1E293B" text-anchor="start">a un código HTTP.</text></svg>