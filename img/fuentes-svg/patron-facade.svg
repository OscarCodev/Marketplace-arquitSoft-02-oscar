<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" role="img"><title>Patrón Facade</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#475569" stroke-width="1.4"/></marker><marker id="t" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L11,6 L0,12 z" fill="#fff" stroke="#475569" stroke-width="1.2"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><defs><marker id="d" viewBox="0 0 16 10" refX="1" refY="5" markerWidth="14" markerHeight="9" orient="auto"><path d="M1,5 L8,1 L15,5 L8,9 z" fill="#475569"/></marker></defs><text x="20" y="26" font-size="15" font-weight="700" fill="#1E293B" text-anchor="start">Facade · integración con el servicio de envío</text><text x="20" y="45" font-size="11" font-weight="400" fill="#64748B" text-anchor="start">Una interfaz simple oculta las operaciones del subsistema del courier</text><rect x="20" y="130" width="200" height="75" fill="#E8F3EC" stroke="#2F7D4F" stroke-width="1.3"/><line x1="20" y1="170" x2="220" y2="170" stroke="#2F7D4F" stroke-width="1"/><line x1="20" y1="180" x2="220" y2="180" stroke="#2F7D4F" stroke-width="1"/><text x="120.0" y="145" font-size="9.5" font-weight="400" fill="#64748B" text-anchor="middle">«cliente · módulo Envíos»</text><text x="120.0" y="160" font-size="12" font-weight="700" fill="#1E293B" text-anchor="middle">SolicitarEnvioUseCase</text><text x="28" y="195" font-size="10.5" font-weight="400" fill="#1E293B" text-anchor="start">+ ejecutar(pedidoId)</text><rect x="290" y="130" width="200" height="75" fill="#FFFFFF" stroke="#475569" stroke-width="1.3"/><