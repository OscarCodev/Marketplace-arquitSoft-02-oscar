th="1.4" stroke-dasharray="5 4" marker-end="url(#t)"/><rect x="540" y="240" width="180" height="78" fill="#F1ECF9" stroke="#6D4AA8" stroke-width="1.3"/><line x1="540" y1="268" x2="720" y2="268" stroke="#6D4AA8" stroke-width="1"/><line x1="540" y1="293" x2="720" y2="293" stroke="#6D4AA8" stroke-width="1"/><text x="630.0" y="258" font-size="12" font-weight="700" fill="#1E293B" text-anchor="middle">DescuentoCupon</text><text x="548" y="283" font-size="10.5" font-weight="400" fill="#1E293B" text-anchor="start">- monto: number</text><text x="548" y="308" font-size="10.5" font-weight="400" fill="#1E293B" text-anchor="start">+ aplicar(subtotal)</text><path d="M630.0,240 L630.0,215 L445.0,215 L445.0,176" fill="none" stroke="#475569" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#t)"/><path d="M240,145.0 L329,145.0" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#o)"/><text x="285" y="139.0" font-size="9.5" fill="#64748B" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="3">delega</text></svg>