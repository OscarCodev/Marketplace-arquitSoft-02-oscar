th="1"/><line x1="525" y1="455" x2="695" y2="455" stroke="#475569" stroke-width="1"/><text x="610.0" y="375" font-size="9.5" font-weight="400" fill="#64748B" text-anchor="middle">«value object»</text><text x="610.0" y="390" font-size="12" font-weight="700" fill="#1E293B" text-anchor="middle">ItemPedido</text><text x="533" y="415" font-size="10.5" font-weight="400" fill="#1E293B" text-anchor="start">+ productoId: string</text><text x="533" y="430" font-size="10.5" font-weight="400" fill="#1E293B" text-anchor="start">+ cantidad: number</text><text x="533" y="445" font-size="10.5" font-weight="400" fill="#1E293B" text-anchor="start">+ precioUnitario: number</text><text x="533" y="470" font-size="10.5" font-weight="400" fill="#1E293B" text-anchor="start">+ subtotal(): number</text><rect x="715" y="360" width="140" height="135" fill="#FFFFFF" stroke="#475569" stroke-width="1.3"/><line x1="715" y1="400" x2="855" y2="400" stroke="#475569" stroke-width="1"/><line x1="715" y1="485" x2="855" y2="485" stroke="#475569" stroke-width="1"/><text x="785.0" y="375" font-size="9.5" font-weight="400" fill="#64748B" text-anchor="middle">«enumeration»</text><text x="785.0" y="390" font-size="12" font-weight="700" fill="#1E293B" text-anchor="middle">EstadoPedido</text><text x="723" y="415" font-size="10.5" font-weight="400" fill="#1E293B" text-anchor="start">PENDIENTE</text><text x="723" y="430" font-size="10.5" font-weight="400" fill="#1E293B" text-anchor="start">PAGADO</text><text x="723" y="445" font-size="10.5" font-weight="400" fill="#1E293B" text-anchor="start">DESPACHADO</text><text x="723" y="460" font-size="10.5" font-weight="400" fill="#1E293B" text-anchor="start">ENTREGADO</text><text x="723" y="475" font-size="10.5" font-weight="400" fill="#1E293B" text-anchor="start">CANCELADO</text><rect x="525" y="515" width="340" height="90" fill="#FFFFFF" stroke="#475569" stroke-width="1.3"/><line x1="525" y1="555" x2="865" y2="555" stroke="#475569" stroke-width="1"/><line x1="525" y1="5