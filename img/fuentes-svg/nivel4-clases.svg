1E293B" text-anchor="start">exportado en index.js).</text><text x="36" y="472" font-size="10" font-weight="400" fill="#1E293B" text-anchor="start">Nunca usa sus clases</text><text x="36" y="486" font-size="10" font-weight="400" fill="#1E293B" text-anchor="start">internas ni sus tablas.</text><path d="M905,910 h278 l12,12 v58 h-290 z" fill="#FFFBEA" stroke="#B7A54A" stroke-width="1.1"/><path d="M1183,910 v12 h12" fill="none" stroke="#B7A54A" stroke-width="1.1"/><text x="913" y="926" font-size="10" font-weight="400" fill="#1E293B" text-anchor="start">Para otra pasarela se agrega</text><text x="913" y="940" font-size="10" font-weight="400" fill="#1E293B" text-anchor="start">otro adaptador que implemente</text><text x="913" y="954" font-size="10" font-weight="400" fill="#1E293B" text-anchor="start">PaymentPort (patrón Adapter).</text></svg>