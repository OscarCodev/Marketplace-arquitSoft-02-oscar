FFFFFF" stroke="#475569" stroke-width="1.3"/><line x1="905" y1="660" x2="1195" y2="660" stroke="#475569" stroke-width="1"/><line x1="905" y1="685" x2="1195" y2="685" stroke="#475569" stroke-width="1"/><text x="1050.0" y="650" font-size="12" font-weight="700" fill="#1E293B" text-anchor="middle">ErpRestAdapter</text><text x="913" y="675" font-size="10.5" font-weight="400" fill="#1E293B" text-anchor="start">- http: cliente HTTP</text><text x="913" y="700" font-size="10.5" font-weight="400" fill="#1E293B" text-anchor="start">+ registrarPedido(pedido)</text><rect x="255" y="790" width="238" height="105" fill="#FFFFFF" stroke="#475569" stroke-width="1.3"/><line x1="255" y1="830" x2="493" y2="830" stroke="#475569" stroke-width="1"/><line x1="255" y1="855" x2="493" y2="855" stroke="#475569" stroke-width="1"/><text x="374.0" y="805" font-size="9.5" font-weight="400" fill="#64748B" text-anchor="middle">«API pública del módulo»</text><text x="374.0" y="820" font-size="12" font-weight="700" fill="#1E293B" text-anchor="middle">ProcesarPagoUseCase</text><text x="263" y="845" font-size="10.5" font-weight="400" fill="#1E293B" text-anchor="start">- paymentPort: PaymentPort</text><text x="263" y="870" font-size="10.5" font-weight="400" fill="#1E293B" text-anchor="start">+ ejecutar(monto, token)</text><text x="263" y="885" font-size="10.5" font-weight="400" fill="#1E293B" text-anchor="start">      : Promise&lt;ResultadoCobro&gt;</text><rect x="525" y="790" width="340" height="75" fill="#FFFFFF" stroke="#475569" stroke-width="1.3"/><line x1="525" y1="830" x2="865" y2="830" stroke="#475569" stroke-width="1"/><line x1="525" y1="840" x2="865" y2="840" stroke="#475569" stroke-width="1"/><text x="695.0" y="805" font-size="9.5" font-weight="400" fill="#64748B" text-anchor="middle">«interface»</text><text x="695.0" y="820" font-size="12" font-weight="700" fill="#1E293B" text-anchor="middle" font-style="italic">PaymentPort</text><text x="533" y="855" font-size="10.5" font-weight="400" fill="#1E293B" text-anchor="start">+ cobrar(monto, token): Promise&lt;ResultadoCobro&gt;</text><rect x="525" y="910" width="200" height="105" fill="#FFFFFF" stroke="#475569" stroke-width="1.3"/><line x1="525" y1="950" x2="725" y2="950" stroke="#475569" stroke-width="1"/><line x1="525" y1="1005" x2="725" y2="1005" stroke="#475569" stroke-width="1"/><text x="625.0" y="925" font-size="9.5" font-weight="400" fill="#64748B" text-anchor="middle">«DTO»</text><text x="625.0" y="940" font-size="12" font-weight="700" fill="#1E293B" text-anchor="middle">ResultadoCobro</text><text x="533" y="965" font-size="10.5" font-weight="400" fill="#1E293B" text-anchor="start">+ aprobado: boolean</text><text x="533" y="980" font-size="10.5" font-weight="400" fill="#1E293B" text-anchor="start">+ autorizacion: string</text><text x="533" y="995" font-size="10.5" font-weight="400" fill="#1E293B" text-anchor="start">+ motivoRechazo?: string</text><rect x="905" y="790" width="290" height="78" fill="#FFFFFF" stroke="#475569" stroke-width="1.3"/><line x1="905" y1="818" x2="1195" y2="818" stroke="#475569" stroke-width="1"/><line x1="905" y1="843" x2="1195" y2="843" stroke="#475569" stroke-width="1"/><text x="1050.0" y="808" font-size="12" font-weight="700" fill="#1E293B" text-anchor="middle">StripePaymentAdapter</text><text x="913" y="833" font-size="10.5" font-weight="400" fill="#1E293B" text-anchor="start">- cliente: SDK de la pasarela</text><text x="913" y="858" font-size="10.5" font-weight="400" fill="#1E293B" text-anchor="start">+ cobrar(monto, token)</text><path d="M228,175 L254,175" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#o)"/><path d="M493,160 L524,160" fill="none" stroke="#475569" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#o)"/><text x="509" y="154" font-size="9.5" fill="#64748B" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="3">«crea»</text><path d="M590,305 L590,359" fill="none" stroke="#475569" stroke-width="1.4" marker-start="url(